<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vinyl box logo" style="color:#111827">
  <title>Vinyl crate with records</title>

  <defs>
    <!-- Hide the part of the records that sits behind the front wall of the crate -->
    <clipPath id="insideCrate">
      <rect x="0" y="0" width="256" height="156"/>
    </clipPath>
  </defs>

  <g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">

    <!-- Back rim of the open crate (behind the records) -->
    <path d="M76 138 L236 138"/>

    <!-- Records standing in the crate, leaning together -->
    <g clip-path="url(#insideCrate)">
      <g transform="rotate(-7 128 180)">
        <!-- two album sleeves flanking a face-out vinyl record -->
        <rect x="50" y="96" width="42" height="80" rx="5"/>
        <rect x="164" y="96" width="42" height="80" rx="5"/>
        <!-- the vinyl record, face out -->
        <circle cx="128" cy="124" r="34"/>
        <circle cx="128" cy="124" r="12" stroke-width="6"/>
        <circle cx="128" cy="124" r="3" fill="currentColor" stroke="none"/>
      </g>
    </g>

    <!-- Open crate body (drawn on top so it hides the records' lower halves) -->
    <!-- front face -->
    <path d="M48 156 L48 206 Q48 212 54 212 L202 212 Q208 212 208 206 L208 156"/>
    <!-- front rim -->
    <path d="M48 156 L208 156"/>
    <!-- right side (depth) -->
    <path d="M208 156 L236 138 L236 188 Q236 194 230 196 L208 206"/>
    <!-- rim depth edges -->
    <path d="M48 156 L76 138"/>
    <path d="M208 156 L236 138"/>
  </g>
</svg>
