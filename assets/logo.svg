<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vinyl box logo" style="color:#111827">
  <title>Vinyl box with records</title>

  <defs>
    <!-- Only show records above the crate rim so they tuck inside the box -->
    <clipPath id="aboveRim">
      <rect x="0" y="0" width="256" height="150"/>
    </clipPath>
    <!-- Clip back records to outside the front record so it sits cleanly on top (works on transparent bg) -->
    <clipPath id="outsideFront" clipPathUnits="userSpaceOnUse">
      <path fill-rule="evenodd" clip-rule="evenodd"
            d="M0 0 H256 V256 H0 Z M82 112 a46 46 0 1 0 92 0 a46 46 0 1 0 -92 0"/>
    </clipPath>
  </defs>

  <g fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">

    <!-- Records fanned inside the crate -->
    <g clip-path="url(#aboveRim)">
      <!-- back left -->
      <circle cx="100" cy="118" r="34" clip-path="url(#outsideFront)"/>
      <!-- back right -->
      <circle cx="156" cy="118" r="34" clip-path="url(#outsideFront)"/>
      <!-- front center -->
      <circle cx="128" cy="112" r="38"/>
      <circle cx="128" cy="112" r="13" stroke-width="6"/>
      <circle cx="128" cy="112" r="2.5" fill="currentColor" stroke="none"/>
    </g>

    <!-- Crate -->
    <path d="M50 150 L66 210 L190 210 L206 150"/>
    <line x1="50" y1="150" x2="206" y2="150"/>
    <!-- Handle slot -->
    <rect x="110" y="176" width="36" height="12" rx="6"/>
  </g>
</svg>
